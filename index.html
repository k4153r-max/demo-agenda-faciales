<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estética Facial · Demo de agenda online</title>
<style>
:root{--lila:#c9a7d8;--lila2:#efe4f5;--rosa:#f7d6d2;--menta:#cdeadd;--menta2:#a8d5c2;--crema:#fffaf6;--txt:#4a3f55;--sub:#86799a;--line:#eadff0;--rojo:#d77a7a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--crema);color:var(--txt)}
header{background:linear-gradient(135deg,var(--lila2),var(--rosa));padding:18px 16px 12px;text-align:center}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 10px;color:var(--sub)}
.mode{display:inline-flex;background:#fff;border-radius:99px;padding:4px;gap:4px}
.mode button,.tabs button{border:0;background:none;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;color:var(--txt)}
.mode button.on{background:var(--lila);color:#fff;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.tabs button.on{background:var(--lila2);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
h2{font-size:1.2rem;margin:0 0 10px}h3{margin:0 0 6px;font-size:1.05rem}
.muted{color:var(--sub);font-size:.9rem}.price{font-weight:700;font-size:1.1rem}
.btn{border:0;border-radius:99px;padding:10px 16px;font:inherit;cursor:pointer;background:var(--lila);color:#fff;font-weight:600}
.btn.sec{background:var(--lila2);color:var(--txt)}.btn.ok{background:#6fb89a}.btn.no{background:var(--rojo)}.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.slot{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;cursor:pointer;font:inherit;color:var(--txt)}
.slot.sel{background:var(--lila);color:#fff;border-color:var(--lila)}.slot.full{background:#f3eef5;color:#b9aec4;text-decoration:line-through}
label{display:block;font-size:.85rem;color:var(--sub);margin:8px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--txt)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
.p-pend{background:#fde9c8}.p-conf{background:var(--menta)}.p-pag{background:var(--menta2)}.p-can{background:#f5d3d3}.p-promo{background:var(--rosa)}
.week{overflow-x:auto}.wk{display:grid;grid-template-columns:50px repeat(6,minmax(105px,1fr));gap:5px;min-width:700px}
.wk .h{font-size:.8rem;color:var(--sub);text-align:center;font-weight:600}.wk .t{font-size:.8rem;color:var(--sub);padding-top:6px}
.c{border:1px solid var(--line);border-radius:10px;min-height:48px;padding:5px;font-size:.76rem;cursor:pointer;background:#fff}
.c.oc{background:var(--lila2)}.c.pg{background:var(--menta)}.c.pe{background:#fdf0dc}.c.mv{outline:2px dashed var(--lila)}
.c b{display:block}
.feed div{border-left:3px solid var(--lila);padding:6px 10px;margin:6px 0;background:#fcf8fe;border-radius:6px;font-size:.9rem}
.feed .tg{border-color:#7fb3d9}.feed .wa{border-color:#6fb89a}
.wa-msg{background:#dcf8c6;border-radius:12px;padding:12px;max-width:420px}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.on{display:flex}.modal .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
.bar{height:14px;background:var(--lila);border-radius:7px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-size:.9rem}
.fab{position:fixed;right:16px;bottom:16px;background:#25d366;color:#fff;border-radius:99px;padding:12px 16px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px #0003;z-index:10}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:20px 16px 80px}
.hidden{display:none}.qr svg{width:180px;height:180px}
</style></head><body>
<header><h1>🌸 Tu Centro de Estética</h1><p>Estética Facial · Demo de agenda online</p>
<div class="mode"><button id="mC" class="on" onclick="setMode('c')">Vista clienta</button><button id="mD" onclick="setMode('d')">Vista dueña</button></div></header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div class="modal" id="modal"><div class="card" id="mbody"></div></div>
<a class="fab" href="javascript:void(0)" onclick="waBtn()">💬 WhatsApp</a>
<footer>Demo con datos de ejemplo · no guarda reservas reales, no cobra nada y los avisos son simulados.<br><br><button class="btn sec sm" onclick="resetDemo()">↺ Reiniciar demo</button></footer>
<script>
const QR=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h35v35H0z"/><path stroke="#5b4a6b" d="M1 1.5h7m6 0h1m2 0h2m1 0h2m1 0h2m2 0h7M1 2.5h1m5 0h1m2 0h1m1 0h1m1 0h5m2 0h2m4 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h2m3 0h1m2 0h3m2 0h4m1 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h1m1 0h2m3 0h1m2 0h1m2 0h1m1 0h1m2 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h1m5 0h3m3 0h1m5 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h2m5 0h1m2 0h1m2 0h1m1 0h2M1 9.5h1m1 0h5m2 0h2m1 0h4m1 0h1m8 0h5M1 10.5h1m1 0h1m7 0h2m6 0h4m1 0h2m1 0h2m1 0h2m1 0h1M1 11.5h1m1 0h1m1 0h3m2 0h4m2 0h2m1 0h1m1 0h2m3 0h1m2 0h1m1 0h1M4 12.5h1m4 0h1m2 0h1m2 0h1m1 0h1m2 0h4m5 0h5M1 13.5h5m1 0h2m2 0h1m7 0h1m3 0h1m1 0h2m1 0h3m1 0h2M1 14.5h6m5 0h1m1 0h5m2 0h1m2 0h1m2 0h1m2 0h1m1 0h2M1 15.5h3m3 0h1m4 0h1m1 0h2m3 0h2m1 0h2m2 0h7M5 16.5h1m3 0h2m1 0h3m2 0h1m1 0h5m1 0h3m1 0h3M1 17.5h1m3 0h1m1 0h3m1 0h2m2 0h1m2 0h1m1 0h1m2 0h1m2 0h1m1 0h2m3 0h1M1 18.5h3m2 0h1m2 0h2m1 0h3m2 0h2m1 0h2m2 0h2m1 0h2m1 0h2m1 0h1M1 19.5h4m2 0h4m1 0h1m3 0h3m3 0h2m4 0h2m1 0h2M1 20.5h1m1 0h4m1 0h2m1 0h1m1 0h2m1 0h1m1 0h5m2 0h2m1 0h5M1 21.5h2m1 0h2m1 0h1m1 0h2m1 0h1m1 0h1m2 0h1m2 0h1m2 0h1m1 0h1m2 0h3m1 0h2M1 22.5h2m2 0h1m2 0h1m1 0h1m1 0h5m2 0h1m4 0h1m2 0h1m3 0h1m1 0h1M1 23.5h1m1 0h3m1 0h1m1 0h1m1 0h4m1 0h2m3 0h3m1 0h1m1 0h1m2 0h3M1 24.5h1m2 0h1m5 0h1m2 0h1m2 0h1m3 0h5m1 0h2m2 0h2m1 0h1M1 25.5h1m4 0h2m2 0h1m2 0h1m2 0h1m1 0h1m1 0h1m2 0h1m1 0h5M9 26.5h1m3 0h3m1 0h1m1 0h2m1 0h1m1 0h2m3 0h1m1 0h1m1 0h1M1 27.5h7m2 0h1m3 0h3m2 0h1m2 0h4m1 0h1m1 0h1m1 0h2M1 28.5h1m5 0h1m1 0h1m1 0h2m1 0h1m2 0h1m4 0h2m1 0h1m3 0h4M1 29.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m4 0h2m2 0h1m1 0h6m1 0h1M1 30.5h1m1 0h3m1 0h1m1 0h2m1 0h3m1 0h2m2 0h1m1 0h2m1 0h1m3 0h5M1 31.5h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h1m3 0h2m1 0h2m1 0h5m1 0h1M1 32.5h1m5 0h1m2 0h2m1 0h2m2 0h1m1 0h2m1 0h2m2 0h2m1 0h3M1 33.5h7m1 0h1m2 0h4m2 0h2m1 0h1m1 0h4m1 0h1m3 0h1"/></svg>
`;
const DAYS=["Lun 2","Mar 3","Mié 4","Jue 5","Vie 6","Sáb 7"],HOURS=[10,11,12,13,14,15,16,17,18],TODAY_IDX=0,ABONO=10000;
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL"),hh=h=>(h<10?"0":"")+h+":00";
let S,mode="c",tab="servicios",sel={},moving=null,myIds=[],timer;
function init(){S={
services:[
{id:"basica",name:"Limpieza facial básica",min:45,price:25000,desc:"Limpieza, exfoliación suave, extracción y mascarilla calmante.",faq:[["¿Cada cuánto me la hago?","Lo ideal es una vez al mes."],["¿Duele la extracción?","Puede molestar un poquito, pero se hace con mucho cuidado."]]},
{id:"profunda",name:"Limpieza facial profunda",min:60,price:35000,desc:"Vapor, extracción completa, alta frecuencia y mascarilla según tu tipo de piel.",faq:[["¿Me quedo con la cara roja?","Un poco por unas horas, ¡nada que un día no arregle!"],["¿Puedo maquillarme después?","Mejor esperar 24 horas."]]},
{id:"hidra",name:"Limpieza + hidratación",min:75,price:40000,desc:"Limpieza profunda más ampolla y masaje hidratante. Ideal para piel seca.",faq:[["¿Sirve para piel sensible?","Sí, usamos productos suaves."],["¿Cuánto dura el efecto?","Notarás la piel más luminosa por 1 a 2 semanas."]]},
{id:"peeling",name:"Peeling suave",min:45,price:30000,desc:"Renovación de la piel con ácidos suaves para manchas y textura.",faq:[["¿Puedo tomar sol?","Evita el sol 48 h y usa bloqueador."],["¿Cuántas sesiones necesito?","Entre 3 y 5, según tu piel."]]}],
promos:[{id:1,name:"Octubre rosa: 15% en Limpieza profunda",svc:"profunda",pct:15,until:"2026-10-31"},{id:2,name:"Noviembre: 10% en Peeling suave",svc:"peeling",pct:10,until:"2026-11-30"}],
bookings:[],waitlist:[{day:5,hour:11,name:"Rocío H.",phone:"+56 9 8111 2233",svc:"basica"}],feed:[],nid:1};
const seed=[[0,10,"Camila R.","profunda","pagada"],[0,12,"Javiera M.","peeling","confirmada"],[0,16,"Fernanda S.","basica","pagada"],[1,11,"Daniela P.","hidra","confirmada"],[1,15,"Constanza V.","basica","confirmada"],[2,10,"Valentina G.","peeling","confirmada"],[2,14,"Camila R.","basica","confirmada"],[2,17,"Isidora L.","basica","confirmada"],[3,13,"Catalina F.","profunda","confirmada"],[3,18,"Antonia B.","peeling","confirmada"],[4,10,"Macarena T.","basica","confirmada"],[4,11,"Javiera M.","profunda","confirmada"],[4,16,"Francisca D.","hidra","confirmada"],[5,10,"Sofía N.","profunda","confirmada"],[5,11,"Trinidad O.","peeling","confirmada"],[5,12,"Martina E.","basica","confirmada"],[5,13,"Fernanda S.","profunda","confirmada"],[5,14,"Camila R.","hidra","confirmada"],[5,16,"Paula C.","basica","confirmada"],[5,17,"Antonia B.","basica","confirmada"],[5,18,"Josefa A.","peeling","confirmada"]];
seed.forEach(s=>S.bookings.push({id:S.nid++,day:s[0],hour:s[1],client:s[2],phone:"+56 9 "+(5000+S.nid*137)+" "+(1000+S.nid*71),svc:s[3],status:s[4],paid:s[4]==="pagada"?svc(s[3]).price:ABONO}));
S.history={"Camila R.":["12 sep · Limpieza facial profunda","10 ago · Peeling suave"],"Javiera M.":["3 oct · Limpieza facial básica"],"Fernanda S.":["20 sep · Limpieza facial básica"]};
note("tg","☀️ Resumen 8:00 · Hoy lunes tienes 3 reservas (10:00, 12:00, 16:00). ¡Buen día!");
myIds=[];sel={svc:"profunda",day:0,hour:null};moving=null}
function svc(id){return S.services.find(s=>s.id===id)}
function slotsOf(b){const s=svc(b.svc);return s&&s.min>60?2:1}
function occ(d,h,ign){return S.bookings.find(b=>b.status!=="cancelada"&&b.id!==ign&&b.day===d&&h>=b.hour&&h<b.hour+slotsOf(b))}
function canStart(d,h,sid,ign){const n=svc(sid).min>60?2:1;for(let i=0;i<n;i++){if(!HOURS.includes(h+i)||occ(d,h+i,ign))return false}return true}
function activePromo(sid){return S.promos.find(p=>p.svc===sid&&p.until>="2026-11-02")}
function priceOf(sid){const p=activePromo(sid),s=svc(sid);return p?s.price*(1-p.pct/100):s.price}
function note(kind,txt){const t=new Date();S.feed.unshift({kind,txt,at:t.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})})}
function setMode(m){mode=m;tab=m==="c"?"servicios":"agenda";document.getElementById("mC").classList.toggle("on",m==="c");document.getElementById("mD").classList.toggle("on",m==="d");render()}
const TABS={c:[["servicios","Servicios"],["reservar","Pedir hora"],["mis","Mis reservas"]],d:[["agenda","Agenda"],["fichas","Fichas"],["caja","Caja"],["reporte","Reporte"],["editor","Servicios y promos"],["avisos","Avisos"],["link","Link y QR"]]};
function go(t){tab=t;render();scrollTo(0,0)}
function render(){document.getElementById("tabs").innerHTML=TABS[mode].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}${t[0]==="avisos"&&S.feed.length?" ("+S.feed.length+")":""}</button>`).join("");
document.getElementById("app").innerHTML=V[tab]();}
const V={
servicios(){return `<div class="card"><h2>Nuestros servicios</h2><p class="muted">Elige tu tratamiento y reserva en menos de un minuto, sin esperar respuesta por WhatsApp.</p></div><div class="grid">`+S.services.map(s=>{const p=activePromo(s.id);return `<div class="card"><h3>${s.name}</h3><p class="muted">⏱ ${s.min} min</p>${p?`<span class="pill p-promo">🎉 ${p.pct}% dcto hasta ${p.until.slice(8)}/${p.until.slice(5,7)}</span><p class="price"><s class="muted">${clp(s.price)}</s> ${clp(priceOf(s.id))}</p>`:`<p class="price">${clp(s.price)}</p>`}<p>${s.desc}</p>${s.faq.map(f=>`<details><summary>${f[0]}</summary><p class="muted">${f[1]}</p></details>`).join("")}<br><button class="btn" onclick="sel.svc='${s.id}';sel.hour=null;go('reservar')">Reservar</button></div>`}).join("")+`</div>`},
reservar(){const s=svc(sel.svc),free=HOURS.filter(h=>canStart(sel.day,h,sel.svc));return `<div class="card"><h2>Pedir hora</h2>
<label>1. Servicio</label><select onchange="sel.svc=this.value;sel.hour=null;render()">${S.services.map(x=>`<option value="${x.id}" ${x.id===sel.svc?"selected":""}>${x.name} · ${x.min} min · ${clp(priceOf(x.id))}</option>`).join("")}</select>
<label>2. Día (noviembre)</label><div class="slots">${DAYS.map((d,i)=>`<button class="slot ${i===sel.day?"sel":""}" onclick="sel.day=${i};sel.hour=null;render()">${d}</button>`).join("")}</div>
<label>3. Hora · ${free.length} disponibles (las tachadas están tomadas)</label><div class="slots">${HOURS.map(h=>{const ok=canStart(sel.day,h,sel.svc);return `<button class="slot ${ok?"":"full"} ${sel.hour===h?"sel":""}" onclick="${ok?`sel.hour=${h};render()`:`waitlist(${h})`}">${hh(h)}</button>`}).join("")}</div>
${free.length===0?`<p class="muted">Este día está lleno. Toca una hora tachada para entrar a la lista de espera.</p>`:`<p class="muted">¿Querías una hora tachada? Tócala y te anotamos en lista de espera.</p>`}
<div class="grid"><div><label>4. Tu nombre</label><input id="fn" value="${sel.name||""}" oninput="sel.name=this.value" placeholder="Ej: Carolina Pérez"></div><div><label>Tu teléfono</label><input id="fp" value="${sel.phone||""}" oninput="sel.phone=this.value" placeholder="+56 9 1234 5678"></div></div><br>
<button class="btn" ${sel.hour===null?"disabled":""} onclick="book()">${sel.hour===null?"Elige una hora":"Reservar "+hh(sel.hour)+" · "+clp(priceOf(sel.svc))}</button>
<p class="muted">Para asegurar tu hora se paga un abono de ${clp(ABONO)}. La hora queda guardada por 30 minutos mientras pagas.</p></div>`},
mis(){const mine=S.bookings.filter(b=>myIds.includes(b.id));if(!mine.length)return `<div class="card"><h2>Mis reservas</h2><p>Aún no reservas en esta demo. <button class="btn sm" onclick="go('reservar')">Pedir hora</button></p></div>`;
return `<div class="card"><h2>Mis reservas</h2>`+mine.map(b=>`<div class="card"><div class="row"><h3 style="margin:0">${svc(b.svc).name}</h3>${pill(b.status)}</div><p>${DAYS[b.day]} nov · ${hh(b.hour)} · ${clp(priceOf(b.svc))}</p>${b.status==="pendiente"?holdTxt(b)+` <button class="btn sm" onclick="pay(${b.id})">Pagar abono</button>`:""} ${b.status!=="cancelada"?`<button class="btn no sm" onclick="cancelB(${b.id},true)">Cancelar mi hora</button>`:""}</div>`).join("")+`</div>`},
agenda(){return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Semana 2 al 7 de noviembre</h2><button class="btn sm" onclick="newOwner()">+ Agendar a mano</button></div>
${moving?`<p class="pill p-pend">Moviendo reserva de ${moving.client}: toca una hora libre (o <a href="javascript:void(0)" onclick="moving=null;render()">cancelar</a>)</p>`:`<p class="muted">Toca una reserva para cobrar, mover o cancelar. Toca un espacio libre para agendar.</p>`}
<div class="row muted" style="font-size:.8rem"><span class="pill p-pend">Abono pendiente</span><span class="pill p-conf">Confirmada</span><span class="pill p-pag">Pagada</span></div><br>
<div class="week"><div class="wk"><div></div>${DAYS.map(d=>`<div class="h">${d}</div>`).join("")}${HOURS.map(h=>`<div class="t">${hh(h)}</div>`+DAYS.map((_,d)=>{const b=occ(d,h);if(!b)return `<div class="c" onclick="cellFree(${d},${h})"><span class="muted">Libre</span></div>`;const cls=b.status==="pagada"?"pg":b.status==="pendiente"?"pe":"oc";return `<div class="c ${cls} ${moving&&moving.id===b.id?"mv":""}" onclick="openB(${b.id})"><b>${b.client}</b>${svc(b.svc).name}${b.hour!==h?" (cont.)":""}</div>`}).join("")).join("")}</div></div></div>
${S.waitlist.length?`<div class="card"><h3>Lista de espera</h3><table>${S.waitlist.map(w=>`<tr><td>${w.name}</td><td>${DAYS[w.day]} ${hh(w.hour)}</td><td>${svc(w.svc).name}</td></tr>`).join("")}</table></div>`:""}`},
fichas(){const by={};S.bookings.forEach(b=>{(by[b.client]=by[b.client]||{phone:b.phone,list:[]}).list.push(b)});return `<div class="card"><h2>Fichas de clientas</h2><p class="muted">Cada clienta queda con su historial automáticamente.</p></div><div class="grid">`+Object.keys(by).sort().map(n=>{const c=by[n],tot=c.list.filter(b=>b.status!=="cancelada").reduce((a,b)=>a+b.paid,0);return `<div class="card"><h3>${n}</h3><p class="muted">📱 ${c.phone}</p>${c.list.map(b=>`<div>${DAYS[b.day]} nov ${hh(b.hour)} · ${svc(b.svc).name} ${pill(b.status)}</div>`).join("")}${(S.history[n]||[]).map(x=>`<div class="muted">${x}</div>`).join("")}<p><b>Pagado esta semana: ${clp(tot)}</b></p></div>`}).join("")+`</div>`},
caja(){let rows="",T=0,TP=0;DAYS.forEach((d,i)=>{const L=S.bookings.filter(b=>b.day===i&&b.status!=="cancelada");const cob=L.reduce((a,b)=>a+b.paid,0),pend=L.reduce((a,b)=>a+priceOf(b.svc)-b.paid,0);T+=cob;TP+=pend;rows+=`<tr><td>${d}</td><td class="n">${L.length}</td><td class="n">${clp(cob)}</td><td class="n">${clp(pend)}</td></tr>`});
return `<div class="card"><h2>Caja</h2><table><tr><th>Día</th><th class="n">Reservas</th><th class="n">Cobrado</th><th class="n">Por cobrar</th></tr>${rows}<tr><th>Total</th><th></th><th class="n">${clp(T)}</th><th class="n">${clp(TP)}</th></tr></table><p class="muted">"Cobrado" incluye abonos y pagos completos. Al cobrar en el local, la reserva pasa a Pagada.</p></div>`},
reporte(){const cnt={};let ing=0,can=0,act=0;S.bookings.forEach(b=>{if(b.status==="cancelada"){can++;return}act++;cnt[b.svc]=(cnt[b.svc]||0)+1;ing+=priceOf(b.svc)});const max=Math.max(1,...Object.values(cnt)),ocup=Math.round(S.bookings.filter(b=>b.status!=="cancelada").reduce((a,b)=>a+slotsOf(b),0)/(DAYS.length*HOURS.length)*100);
return `<div class="card"><h2>Reporte de la semana</h2><div class="grid"><div class="card"><p class="muted">Reservas</p><p class="price">${act}</p></div><div class="card"><p class="muted">Ingresos esperados</p><p class="price">${clp(ing)}</p></div><div class="card"><p class="muted">Ocupación</p><p class="price">${ocup}%</p></div><div class="card"><p class="muted">Cancelaciones</p><p class="price">${can}</p></div></div><h3>Servicios más pedidos</h3>${S.services.map(s=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${s.name}</span><b>${cnt[s.id]||0}</b></div><div class="bar" style="width:${(cnt[s.id]||0)/max*100}%"></div></div>`).join("")}</div>`},
editor(){return `<div class="card"><h2>Servicios</h2><p class="muted">Cambia precios o duración y se actualizan al tiro en la vista clienta.</p><table><tr><th>Servicio</th><th>Min</th><th>Precio</th></tr>${S.services.map(s=>`<tr><td>${s.name}</td><td><input type="number" value="${s.min}" style="width:70px" onchange="svc('${s.id}').min=+this.value"></td><td><input type="number" value="${s.price}" style="width:100px" onchange="svc('${s.id}').price=+this.value"></td></tr>`).join("")}</table></div>
<div class="card"><h2>Promociones</h2><p class="muted">Hoy en la demo es lunes 2 de noviembre. Las promos vencidas se ocultan solas para las clientas.</p><table>${S.promos.map(p=>`<tr><td>${p.name}</td><td>${p.until>="2026-11-02"?'<span class="pill p-conf">Activa</span>':'<span class="pill p-can">Vencida · oculta</span>'}</td><td>hasta ${p.until}</td></tr>`).join("")}</table>
<div class="grid"><div><label>Nombre</label><input id="pn" placeholder="Ej: Cyber: 20% en básica"></div><div><label>Servicio</label><select id="ps">${S.services.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></div><div><label>% dcto</label><input id="pp" type="number" value="20"></div><div><label>Válida hasta</label><input id="pu" type="date" value="2026-11-15"></div></div><br><button class="btn" onclick="addPromo()">Agregar promo</button></div>`},
avisos(){return `<div class="card"><h2>Avisos (simulados)</h2><p class="muted">Así te llegarían las alertas al Telegram o WhatsApp. En esta demo no se envía nada.</p><div class="row"><button class="btn sec sm" onclick="note('tg','☀️ Resumen 8:00 · Mañana tienes '+S.bookings.filter(b=>b.day===1&&b.status!=='cancelada').length+' reservas.');render()">Simular resumen 8:00</button><button class="btn sec sm" onclick="remind()">Simular recordatorios del día siguiente</button></div><div class="feed">${S.feed.map(f=>`<div class="${f.kind}"><span class="muted">${f.at} · ${f.kind==="tg"?"Telegram":"WhatsApp"}</span><br>${f.txt}</div>`).join("")}</div></div>`},
link(){return `<div class="card" style="text-align:center"><h2>Tu link de reservas</h2><p class="muted">Lo pones en tu Instagram, en tu estado de WhatsApp o impreso en el local.</p><div class="qr">${QR}</div><p><b>k4153r-max.github.io/demo-agenda-faciales</b></p><button class="btn sec" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='¡Copiado!'">Copiar link</button></div>`}};
function pill(s){return `<span class="pill ${{pendiente:"p-pend",confirmada:"p-conf",pagada:"p-pag",cancelada:"p-can"}[s]}">${{pendiente:"Abono pendiente",confirmada:"Confirmada",pagada:"Pagada",cancelada:"Cancelada"}[s]}</span>`}
function holdTxt(b){const ms=b.holdUntil-Date.now();if(ms<=0)return "";const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `<span class="pill p-pend">Hora guardada por ${m}:${s<10?"0":""}${s}</span>`}
function modal(h){document.getElementById("mbody").innerHTML=h;document.getElementById("modal").classList.add("on")}
function close_(){document.getElementById("modal").classList.remove("on");render()}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")close_()};
function book(){const n=(sel.name||"").trim(),p=(sel.phone||"").trim();if(n.length<2||p.length<8){alert("Escribe tu nombre y un teléfono válido 😊");return}
if(!canStart(sel.day,sel.hour,sel.svc)){alert("Uy, esa hora se acaba de tomar. Elige otra.");sel.hour=null;render();return}
const b={id:S.nid++,day:sel.day,hour:sel.hour,client:n,phone:p,svc:sel.svc,status:"pendiente",paid:0,holdUntil:Date.now()+30*60000};S.bookings.push(b);myIds.push(b.id);sel.hour=null;
note("tg",`🆕 Nueva reserva: ${n} · ${svc(b.svc).name} · ${DAYS[b.day]} ${hh(b.hour)} (abono pendiente)`);payModal(b)}
function payModal(b){modal(`<h2>Paga tu abono</h2><p>${svc(b.svc).name}<br>${DAYS[b.day]} de noviembre · ${hh(b.hour)}</p><p class="price">Abono: ${clp(ABONO)} <span class="muted">de ${clp(priceOf(b.svc))}</span></p><p id="hold">${holdTxt(b)}</p><p class="pill p-pend">SIMULADO · pago tipo MercadoPago, no se cobra nada</p><br><br><button class="btn ok" onclick="pay(${b.id})">Pagar abono (simulado)</button> <button class="btn sec" onclick="expire(${b.id})">Simular que pasaron 30 min</button><br><br><button class="btn sec sm" onclick="close_()">Pagar después</button>`)}
function pay(id){const b=S.bookings.find(x=>x.id===id);if(!b||b.status!=="pendiente")return close_();b.status="confirmada";b.paid=ABONO;
note("tg",`💳 Pago confirmado: abono ${clp(ABONO)} de ${b.client}`);note("wa",`A ${b.client}: ¡Hola! Tu hora de ${svc(b.svc).name} quedó confirmada para el ${DAYS[b.day]} nov a las ${hh(b.hour)}. Te mandaremos un recordatorio el día antes 🌸`);
modal(`<h2>¡Reserva confirmada! ✨</h2><p>${pill("confirmada")}</p><p><b>${svc(b.svc).name}</b><br>${DAYS[b.day]} de noviembre · ${hh(b.hour)}<br>Total ${clp(priceOf(b.svc))} · abonado ${clp(ABONO)} · resto en el local ${clp(priceOf(b.svc)-ABONO)}</p><p class="muted">Te enviamos un recordatorio por WhatsApp (simulado):</p><div class="wa-msg">Hola ${b.client.split(" ")[0]} 🌸 Te esperamos el ${DAYS[b.day]} de noviembre a las ${hh(b.hour)} para tu ${svc(b.svc).name}. Si no puedes venir, cancela desde tu link. ¡Gracias!</div><br><button class="btn" onclick="close_()">Listo</button>`)}
function expire(id){const b=S.bookings.find(x=>x.id===id);if(b&&b.status==="pendiente"){b.status="cancelada";note("tg",`⌛ Se liberó la hora de ${b.client} (${DAYS[b.day]} ${hh(b.hour)}): no pagó el abono en 30 min`);freed(b)}
modal(`<h2>Se acabó el tiempo ⌛</h2><p>No se pagó el abono en 30 minutos, así que la hora se liberó para otra clienta.</p><button class="btn" onclick="close_()">Entendido</button>`)}
function cancelB(id,self){const b=S.bookings.find(x=>x.id===id);if(!b||!confirm("¿Cancelar la hora de "+b.client+"?"))return;b.status="cancelada";note("tg",`❌ Cancelación${self?" de la clienta":""}: ${b.client} · ${DAYS[b.day]} ${hh(b.hour)}`);freed(b);close_()}
function freed(b){const w=S.waitlist.find(w=>w.day===b.day&&w.hour===b.hour);if(w){note("wa",`A ${w.name}: ¡Se liberó tu hora del ${DAYS[w.day]} a las ${hh(w.hour)}! Entra al link para tomarla antes que otra persona 💜`);S.waitlist=S.waitlist.filter(x=>x!==w)}}
function waitlist(h){if(occ(sel.day,h)===undefined&&canStart(sel.day,h,sel.svc))return;const n=prompt("Esa hora está tomada. Escribe tu nombre y te avisamos por WhatsApp si se libera:",sel.name||"");if(!n)return;S.waitlist.push({day:sel.day,hour:h,name:n,phone:sel.phone||"",svc:sel.svc});note("tg",`📋 ${n} entró a lista de espera: ${DAYS[sel.day]} ${hh(h)}`);alert("¡Listo! Quedaste en lista de espera 💜");render()}
function openB(id){const b=S.bookings.find(x=>x.id===id);if(moving)return;const s=svc(b.svc);modal(`<h2>${b.client}</h2><p>${pill(b.status)}</p><p>${s.name} · ${s.min} min<br>${DAYS[b.day]} nov · ${hh(b.hour)}<br>📱 ${b.phone}<br>Pagado ${clp(b.paid)} de ${clp(priceOf(b.svc))}</p><div class="row">${b.status!=="pagada"?`<button class="btn ok" onclick="cobrar(${b.id})">Cobrar ${clp(priceOf(b.svc)-b.paid)}</button>`:""}<button class="btn sec" onclick="startMove(${b.id})">Mover</button><button class="btn no" onclick="cancelB(${b.id},false)">Cancelar</button><button class="btn sec" onclick="close_()">Cerrar</button></div>`)}
function cobrar(id){const b=S.bookings.find(x=>x.id===id);b.paid=priceOf(b.svc);b.status="pagada";note("tg",`💰 Cobrado en el local: ${clp(b.paid)} a ${b.client}`);close_()}
function startMove(id){moving=S.bookings.find(x=>x.id===id);document.getElementById("modal").classList.remove("on");render()}
function cellFree(d,h){if(moving){if(!canStart(d,h,moving.svc,moving.id)){alert("No cabe ahí, elige otra hora libre.");return}const o=`${DAYS[moving.day]} ${hh(moving.hour)}`;moving.day=d;moving.hour=h;note("wa",`A ${moving.client}: Tu hora se cambió de ${o} a ${DAYS[d]} ${hh(h)} 🌸`);moving=null;render();return}newOwner(d,h)}
function newOwner(d,h){d=d??0;h=h??10;modal(`<h2>Agendar a mano</h2><label>Clienta</label><input id="on" placeholder="Nombre"><label>Teléfono</label><input id="op" placeholder="+56 9"><label>Servicio</label><select id="os">${S.services.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select><label>Día</label><select id="od">${DAYS.map((x,i)=>`<option value="${i}" ${i===d?"selected":""}>${x}</option>`).join("")}</select><label>Hora</label><select id="oh">${HOURS.map(x=>`<option ${x===h?"selected":""}>${x}</option>`).join("")}</select><br><br><button class="btn" onclick="saveOwner()">Guardar</button> <button class="btn sec" onclick="close_()">Cerrar</button>`)}
function saveOwner(){const g=i=>document.getElementById(i).value,d=+g("od"),h=+g("oh"),s=g("os"),n=g("on").trim();if(!n){alert("Falta el nombre");return}if(!canStart(d,h,s)){alert("Esa hora ya está ocupada (no se permite doble reserva).");return}
S.bookings.push({id:S.nid++,day:d,hour:h,client:n,phone:g("op")||"—",svc:s,status:"confirmada",paid:0});note("tg",`🆕 Reserva agendada a mano: ${n} · ${DAYS[d]} ${hh(h)}`);close_()}
function addPromo(){const g=i=>document.getElementById(i).value;if(!g("pn"))return alert("Ponle nombre a la promo");S.promos.push({id:Date.now(),name:g("pn"),svc:g("ps"),pct:+g("pp"),until:g("pu")});render()}
function remind(){S.bookings.filter(b=>b.day===1&&b.status!=="cancelada").forEach(b=>note("wa",`A ${b.client}: Recordatorio 🌸 Mañana ${DAYS[b.day]} a las ${hh(b.hour)} tienes ${svc(b.svc).name}. ¡Te esperamos!`));render()}
function waBtn(){alert("En la versión real este botón abre WhatsApp con un mensaje listo para el centro. En la demo no abre nada 😊")}
function resetDemo(){init();setMode(mode)}
init();render();
setInterval(()=>{const h=document.getElementById("hold");if(h){const b=S.bookings.find(x=>x.status==="pendiente"&&myIds.includes(x.id));if(b)h.innerHTML=holdTxt(b)}const now=Date.now();S.bookings.forEach(b=>{if(b.status==="pendiente"&&b.holdUntil<now){b.status="cancelada";freed(b)}})},1000);
</script></body></html>
